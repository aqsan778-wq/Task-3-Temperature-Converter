<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="converter-card">

            <!-- Header -->
            <div class="header">
                <div class="temperature-icon">°</div>

                <p class="small-title">TEMPERATURE TOOL</p>

                <h1>Temperature Converter</h1>

                <p class="subtitle">
                    Convert temperatures quickly between Celsius,
                    Fahrenheit and Kelvin.
                </p>
            </div>


            <!-- Converter Form -->
            <div class="converter-form">

                <div class="form-group">

                    <label for="temperature">
                        Enter Temperature
                    </label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="e.g. 25"
                        step="any"
                    >

                </div>


                <div class="form-group">

                    <label for="unit">
                        Select Unit
                    </label>

                    <select id="unit">

                        <option value="C">
                            Celsius (°C)
                        </option>

                        <option value="F">
                            Fahrenheit (°F)
                        </option>

                        <option value="K">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <button id="convertBtn">
                    Convert Temperature
                </button>

            </div>


            <!-- Error Message -->
            <div id="errorMessage" class="error-message"></div>


            <!-- Results -->
            <div id="results" class="results">

                <h2>Conversion Results</h2>

                <div class="result-grid">

                    <div class="result-box">

                        <span class="result-label">
                            Celsius
                        </span>

                        <strong id="celsiusResult">
                            --
                        </strong>

                    </div>


                    <div class="result-box">

                        <span class="result-label">
                            Fahrenheit
                        </span>

                        <strong id="fahrenheitResult">
                            --
                        </strong>

                    </div>


                    <div class="result-box">

                        <span class="result-label">
                            Kelvin
                        </span>

                        <strong id="kelvinResult">
                            --
                        </strong>

                    </div>

                </div>

            </div>


            <!-- Formula Information -->
            <div class="info">

                <h3>Conversion Formulas</h3>

                <p>
                    °F = (°C × 9/5) + 32
                </p>

                <p>
                    °C = (°F − 32) × 5/9
                </p>

                <p>
                    K = °C + 273.15
                </p>

            </div>

        </div>


        <footer>
            © 2026 Temperature Converter
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
